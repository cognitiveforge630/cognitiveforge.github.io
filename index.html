---
title: Cognitive Forge
---

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ site.title | escape }}</title>
    {% include seo.html %}
    {% include goatcounter.html %}
    <style>
      :root {
        color-scheme: light;
        --bg: #fbfaf8;
        --panel: #ffffff;
        --text: #1f2933;
        --muted: #667085;
        --rule: #d9dee7;
        --accent: #2563eb;
        --accent-soft: #e8f0ff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.65;
      }

      main {
        width: min(100% - 32px, 840px);
        margin: 0 auto 48px;
        padding-top: 32px;
      }

      h1 {
        margin: 0 0 10px;
        font-size: clamp(2rem, 5vw, 3.25rem);
        line-height: 1.08;
      }

      .intro {
        color: var(--muted);
        margin-bottom: 32px;
      }

      .post-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 14px;
      }

      .post-list a {
        display: block;
        background: var(--panel);
        border: 1px solid var(--rule);
        border-radius: 8px;
        padding: 18px 20px;
        color: var(--text);
        text-decoration: none;
      }

      .post-list a:hover {
        border-color: var(--accent);
      }

      .post-title {
        display: block;
        font-weight: 700;
      }

      .post-date {
        display: block;
        color: var(--muted);
        font-size: 0.92rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>{{ site.title | escape }}</h1>
      <p class="intro">{{ site.description | escape }}</p>

      <ul class="post-list">
        {% for post in site.posts %}
          <li>
            <a href="{{ post.url | relative_url }}">
              <span class="post-title">{{ post.title | escape }}</span>
              <span class="post-date">{{ post.date | date: "%B %-d, %Y" }}</span>
            </a>
          </li>
        {% endfor %}
      </ul>
    </main>
  </body>
</html>
